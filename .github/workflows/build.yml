name: Build dataset
on:
  workflow_dispatch:
  push:
    paths:
      - "src/gridbench/smard.py"
      - "scripts/download.py"
      - ".github/workflows/build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reuse weekly files from the last run
        uses: actions/cache@v4
        with:
          path: data/raw/smard
          key: smard-${{ github.run_id }}
          restore-keys: smard-
      - name: Download from SMARD
        run: python scripts/download.py | tee download.log
      - name: Summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat download.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: smard-hourly
          path: data/raw/smard_hourly.csv
          retention-days: 14
